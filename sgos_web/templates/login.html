<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SGOS | Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="login-page">
  <div class="card login-card">
    <div class="card-body">
      <h2 class="card-title"><i class="bi bi-shield-lock"></i> Acceso SGOS</h2>
      
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="alert alert-danger" role="alert">
            {{ messages[0] }}
          </div>
        {% endif %}
      {% endwith %}

      <form method="post" id="login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label for="username" class="form-label">Usuario</label>
          <input type="text" class="form-control" id="username" name="username" required autofocus>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <div class="input-group">
            <input type="password" class="form-control" id="password" name="password" required>
            <button type="button" class="btn btn-outline-secondary" onclick="togglePwd()" tabindex="-1">
              <i class="bi bi-eye" id="eye-icon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-primary-full" id="btn-login">
          <span id="btn-login-text">Ingresar</span>
          <span id="btn-login-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
        </button>
        <div id="db-status" class="form-text mt-2 text-muted"></div>
      </form>
    </div>
  </div>

  <script>
  function togglePwd() {
    const input = document.getElementById('password');
    const icon = document.getElementById('eye-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
      input.type = 'password';
      icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
  }

  // Despierta la BD de Neon (que se duerme tras inactividad) antes de enviar
  // las credenciales. Reintenta con backoff hasta ~23s.
  (function() {
    const form    = document.getElementById('login-form');
    const btn     = document.getElementById('btn-login');
    const btnTxt  = document.getElementById('btn-login-text');
    const spinner = document.getElementById('btn-login-spinner');
    const status  = document.getElementById('db-status');

    async function waitForDb() {
      const delays = [0, 800, 1500, 2500, 4000, 6000, 8000];
      for (let i = 0; i < delays.length; i++) {
        if (delays[i]) await new Promise(r => setTimeout(r, delays[i]));
        try {
          const r = await fetch('/db/ping', { cache: 'no-store' });
          if (r.ok) {
            const j = await r.json();
            if (j.ready) return { ok: true, ms: j.elapsed_ms };
          }
        } catch (_) { /* red caída, seguimos reintentando */ }
        status.textContent = 'Despertando base de datos… (intento ' + (i + 1) + ')';
      }
      return { ok: false };
    }

    form.addEventListener('submit', async function(ev) {
      if (btn.dataset.ready === '1') return; // ya verificada, deja que envíe

      ev.preventDefault();
      btn.disabled = true;
      spinner.classList.remove('d-none');
      btnTxt.textContent = 'Conectando…';
      status.textContent = 'Verificando base de datos…';

      const res = await waitForDb();

      if (res.ok) {
        status.textContent = 'Base de datos lista (' + res.ms + ' ms). Ingresando…';
        btnTxt.textContent = 'Ingresando…';
        btn.dataset.ready = '1';
        form.submit();
      } else {
        status.textContent = 'No se pudo conectar a la base de datos. Intenta nuevamente.';
        btnTxt.textContent = 'Reintentar';
        spinner.classList.add('d-none');
        btn.disabled = false;
      }
    });
  })();
  </script>
</body>
</html>
