{% extends "layout.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container-fluid mt-4">
    <div class="header-dashboard mb-4 d-flex justify-content-between align-items-center">
        <h1><i class="bi bi-pie-chart-fill"></i> {{ title }}</h1>
        
        <form action="{{ url_for(endpoint) }}" method="get" class="d-flex align-items-center">
            <label for="year" class="me-2 text-light">Filtrar por Año:</label>
            <select name="year" id="year" class="form-select form-select-sm me-2 w-auto" onchange="this.form.submit()">
                <option value="">Todos</option>
                {% for y in years %}
                <option value="{{ y }}" {% if selected_year == y %}selected{% endif %}>{{ y }}</option>
                {% endfor %}
            </select>
        </form>
    </div>

    <div class="row mb-4">
        <!-- Resumen Mensual: Operaciones -->
        <div class="col-md-6 mb-4">
            <div class="card h-100 shadow-sm bg-dark text-light border-secondary">
                <div class="card-header border-secondary">
                    <h5 class="card-title mb-0"><i class="bi bi-calendar-check"></i> Operaciones por Mes</h5>
                </div>
                <div class="card-body">
                    <canvas id="chartMesOps"></canvas>
                </div>
            </div>
        </div>

        <!-- Resumen Mensual: Montos -->
        <div class="col-md-6 mb-4">
            <div class="card h-100 shadow-sm bg-dark text-light border-secondary">
                <div class="card-header border-secondary">
                    <h5 class="card-title mb-0"><i class="bi bi-currency-dollar"></i> Montos por Mes</h5>
                </div>
                <div class="card-body">
                    <canvas id="chartMesMonto"></canvas>
                </div>
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <!-- Operaciones por Hora -->
        <div class="col-md-6 mb-4">
            <div class="card h-100 shadow-sm bg-dark text-light border-secondary">
                <div class="card-header border-secondary">
                    <h5 class="card-title mb-0"><i class="bi bi-clock"></i> Operaciones por Hora (Promedio)</h5>
                </div>
                <div class="card-body">
                    <canvas id="chartHoraOps"></canvas>
                </div>
            </div>
        </div>

        <!-- Montos por Hora -->
        <div class="col-md-6 mb-4">
            <div class="card h-100 shadow-sm bg-dark text-light border-secondary">
                <div class="card-header border-secondary">
                    <h5 class="card-title mb-0"><i class="bi bi-cash-coin"></i> Montos por Hora (Promedio)</h5>
                </div>
                <div class="card-body">
                    <canvas id="chartHoraMonto"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="{{ url_for('static', filename='js/sgos-charts.js') }}"></script>

<script>
    const T = window.SGOSChartTheme;
    const dataMes = {{ data_mes | tojson }};
    const dataHora = {{ data_hora | tojson }};

    // 1. Operaciones por Mes
    new Chart(document.getElementById('chartMesOps'), {
        type: 'bar',
        data: {
            labels: dataMes.labels,
            datasets: [{
                label: 'Operaciones',
                data: dataMes.ops,
                backgroundColor: T.alpha(T.gold, 0.55),
                borderColor: T.gold,
                borderWidth: 1,
                borderRadius: 6
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });

    // 2. Montos por Mes
    new Chart(document.getElementById('chartMesMonto'), {
        type: 'line',
        data: {
            labels: dataMes.labels,
            datasets: [{
                label: 'Monto Total',
                data: dataMes.monto,
                backgroundColor: T.alpha(T.emerald, 0.18),
                borderColor: T.emerald,
                borderWidth: 2,
                fill: true,
                tension: 0.3,
                pointBackgroundColor: T.emerald
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });

    // 3. Operaciones por Hora (Promedio)
    new Chart(document.getElementById('chartHoraOps'), {
        type: 'bar',
        data: {
            labels: dataHora.labels,
            datasets: [{
                label: 'Promedio Operaciones',
                data: dataHora.ops_avg,
                backgroundColor: T.alpha(T.info, 0.55),
                borderColor: T.info,
                borderWidth: 1,
                borderRadius: 6
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });

    // 4. Montos por Hora (Promedio)
    new Chart(document.getElementById('chartHoraMonto'), {
        type: 'line',
        data: {
            labels: dataHora.labels,
            datasets: [{
                label: 'Promedio Monto ($)',
                data: dataHora.monto_avg,
                backgroundColor: T.alpha(T.amber, 0.2),
                borderColor: T.amber,
                borderWidth: 2,
                fill: true,
                tension: 0.3,
                pointBackgroundColor: T.amber
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });
</script>
{% endblock %}
