{% extends "comps/layout_comps.html" %}
{% block title %}COMPS — Exportar Reportes{% endblock %}

{% block content %}
<a href="{{ url_for('comps.comps_index') }}" class="btn btn-outline-secondary btn-sm mb-3"><i class="bi bi-arrow-left"></i> Volver</a>
<h2 class="mb-4"><i class="bi bi-download"></i> Exportar Reportes</h2>

<div class="card">
  <div class="card-body">
    <form method="POST" action="{{ url_for('comps.exportar_generar') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <label class="form-label">Año</label>
          <select name="anio" class="form-select">
            <option value="">Todos</option>
            {% for a in anios %}<option value="{{ a }}">{{ a }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Mes</label>
          <select name="mes" class="form-select">
            <option value="">Todos</option>
            {% for m in meses_disp %}<option value="{{ m }}">{{ MESES_NOMBRE.get(m, m) }}</option>{% endfor %}
          </select>
        </div>
      </div>

      <h5 class="mb-3">Secciones a incluir:</h5>
      <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="chk_all" checked>
        <label class="form-check-label fw-bold" for="chk_all">Seleccionar todas</label>
      </div>
      <div class="row g-3 mb-4" id="secciones-list">
        <div class="col-md-4">
          <div class="form-check">
            <input class="form-check-input seccion-chk" type="checkbox" name="secciones" value="cortesias" id="chk_cort" checked>
            <label class="form-check-label" for="chk_cort"><i class="bi bi-gift"></i> Análisis Cortesías</label>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-check">
            <input class="form-check-input seccion-chk" type="checkbox" name="secciones" value="premios" id="chk_prem" checked>
            <label class="form-check-label" for="chk_prem"><i class="bi bi-trophy"></i> Análisis Premios</label>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-check">
            <input class="form-check-input seccion-chk" type="checkbox" name="secciones" value="resumen" id="chk_res" checked>
            <label class="form-check-label" for="chk_res"><i class="bi bi-clipboard-data"></i> Resumen General</label>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-check">
            <input class="form-check-input seccion-chk" type="checkbox" name="secciones" value="control_general" id="chk_ctrl" checked>
            <label class="form-check-label" for="chk_ctrl"><i class="bi bi-people"></i> Control Invitaciones</label>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-check">
            <input class="form-check-input seccion-chk" type="checkbox" name="secciones" value="control_mda" id="chk_mda" checked>
            <label class="form-check-label" for="chk_mda"><i class="bi bi-joystick"></i> Control MDA</label>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-check">
            <input class="form-check-input seccion-chk" type="checkbox" name="secciones" value="control_mdj" id="chk_mdj" checked>
            <label class="form-check-label" for="chk_mdj"><i class="bi bi-suit-spade"></i> Control MDJ</label>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-check">
            <input class="form-check-input seccion-chk" type="checkbox" name="secciones" value="control_mrk" id="chk_mrk" checked>
            <label class="form-check-label" for="chk_mrk"><i class="bi bi-megaphone"></i> Control MRK</label>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-check">
            <input class="form-check-input seccion-chk" type="checkbox" name="secciones" value="coinin_cero" id="chk_ci0" checked>
            <label class="form-check-label" for="chk_ci0"><i class="bi bi-exclamation-triangle"></i> Auditoría Coin-In Cero</label>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-success btn-lg" id="btnExportar">
        <i class="bi bi-file-earmark-excel"></i> Generar Excel
      </button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const chkAll = document.getElementById('chk_all');
  const chks = document.querySelectorAll('.seccion-chk');
  chkAll.addEventListener('change', () => chks.forEach(c => c.checked = chkAll.checked));
  chks.forEach(c => c.addEventListener('change', () => {
    chkAll.checked = [...chks].every(c => c.checked);
  }));

  // Descarga via fetch (desktop guarda en Descargas, web descarga blob)
  const form = document.querySelector('form');
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnExportar');
    btn.classList.add('disabled');
    btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span> Generando...';
    fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      credentials: 'same-origin'
    })
    .then(resp => {
      if (!resp.ok) throw new Error('Error en exportación');
      const ct = resp.headers.get('Content-Type') || '';
      if (ct.includes('application/json')) {
        return resp.json().then(data => {
          alert('Archivo guardado en:\n' + data.path);
        });
      }
      let filename = 'reporte_comps.xlsx';
      let cd = resp.headers.get('Content-Disposition');
      if (cd) {
        let m = cd.match(/filename[^;=\n]*=["']?([^"';\n]+)/);
        if (m) filename = m[1];
      }
      return resp.blob().then(blob => {
        let a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 100);
      });
    })
    .catch(err => alert('Error al exportar: ' + err.message))
    .finally(() => {
      btn.classList.remove('disabled');
      btn.innerHTML = '<i class="bi bi-file-earmark-excel"></i> Generar Excel';
    });
  });
</script>
{% endblock %}
