{% extends "comps/layout_comps.html" %}
{% block title %}COMPS — Exportar Reportes{% endblock %}

{% block content %}
<a href="{{ url_for('comps.comps_index') }}" class="btn btn-outline-secondary btn-sm mb-3"><i class="bi bi-arrow-left"></i> Volver</a>
<h2 class="mb-4"><i class="bi bi-download"></i> Exportar Reportes</h2>

<div class="card">
  <div class="card-body">
    <form method="POST" action="{{ url_for('comps.exportar_generar') }}">
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <label class="form-label">Año</label>
          <select name="anio" class="form-select">
            <option value="">Todos</option>
            {% for a in anios %}<option value="{{ a }}">{{ a }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label">Mes</label>
          <select name="mes" class="form-select">
            <option value="">Todos</option>
            {% for m in meses_disp %}<option value="{{ m }}">{{ MESES_NOMBRE.get(m, m) }}</option>{% endfor %}
          </select>
        </div>
      </div>

      <h5 class="mb-3">Secciones a incluir:</h5>
      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="secciones" value="cortesias" id="chk_cort" checked>
            <label class="form-check-label" for="chk_cort"><i class="bi bi-gift"></i> Cortesías</label>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="secciones" value="premios" id="chk_prem" checked>
            <label class="form-check-label" for="chk_prem"><i class="bi bi-trophy"></i> Premios</label>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="secciones" value="resumen" id="chk_res" checked>
            <label class="form-check-label" for="chk_res"><i class="bi bi-clipboard-data"></i> Resumen General</label>
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-success btn-lg">
        <i class="bi bi-file-earmark-excel"></i> Generar Excel
      </button>
    </form>
  </div>
</div>
{% endblock %}
